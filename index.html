<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d35"><title>Darren's Recipes</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#19342e;background:#f6f5ef}*{box-sizing:border-box}body{margin:0}header{background:#153d35;color:white;padding:25px max(18px,calc((100vw - 920px)/2))}header h1{margin:0 0 8px}header p{margin:0;opacity:.85}main{max-width:920px;margin:auto;padding:18px}input{width:100%;font:inherit;padding:14px;border:1px solid #c8d4ce;border-radius:12px;background:white}#count{color:#53635c;font-size:.9rem;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:white;border:1px solid #e1e7e2;border-radius:15px;padding:18px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:0 2px 9px #1b362b0a}.card h2{font-size:1.12rem;margin:10px 0}.card p{line-height:1.45}.meta{font-size:.85rem;color:#63766c}dialog{width:min(660px,calc(100vw - 20px));max-height:90dvh;overflow:auto;border:0;border-radius:16px;padding:25px;color:#19342e}dialog::backdrop{background:#0008}dialog h2{margin-top:0}li{margin:8px 0;line-height:1.5}.close{float:right;border:0;background:#e8efeb;padding:8px 13px;border-radius:10px;font-size:1rem;cursor:pointer}#error{color:#a12c24}
</style></head><body><header><h1>🍽️ Darren's Recipes</h1><p>Our favourite meals, refined as we cook them</p></header><main><input id="search" type="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes"><p id="count">Loading recipes…</p><p id="error"></p><div class="cards" id="cards"></div></main><dialog id="details"><button class="close" onclick="document.getElementById('details').close()">Close</button><div id="detail"></div></dialog>
<script>
let recipes=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('search').value.trim().toLowerCase();const filtered=recipes.filter(r=>[r.title,r.summary,...(r.ingredients||[])].join(' ').toLowerCase().includes(q));$('count').textContent=filtered.length+' of '+recipes.length+' recipes';$('cards').innerHTML=filtered.map(r=>'<button class="card" data-id="'+esc(r.id)+'"><div>'+esc(r.flag||'🍲')+' <span class="meta">'+esc(r.type||'')+' · '+esc(r.time||'')+'</span></div><h2>'+esc(r.title)+'</h2><p>'+esc(r.summary||'')+'</p><div class="meta">'+esc(r.serves||'')+' servings · '+esc(r.status||'')+'</div></button>').join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>openRecipe(b.dataset.id))}
function openRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;$('detail').innerHTML='<h2>'+esc(r.flag||'')+' '+esc(r.title)+'</h2><p>'+esc(r.summary||'')+'</p><p class="meta">'+esc(r.time||'')+' · Serves '+esc(r.serves||'')+'</p><h3>Ingredients</h3><ul>'+(r.ingredients||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h3>Method</h3><ol>'+(r.steps||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'+(r.note?'<h3>Cooking notes</h3><p>'+esc(r.note)+'</p>':'');$('details').showModal()}
$('search').addEventListener('input',render);
fetch('./recipes.json?updated='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('recipes.json missing');return r.json()}).then(data=>{recipes=Array.isArray(data)?data:data.recipes||[];render()}).catch(e=>{$('count').textContent='Recipes unavailable';$('error').textContent='Could not load recipes.json: '+e.message});
</script></body></html>
